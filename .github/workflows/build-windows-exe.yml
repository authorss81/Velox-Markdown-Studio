name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web application
        run: |
          npm run build

      - name: Package Windows Executable (.exe)
        run: |
          npx --yes electron-builder --win nsis portable --publish never

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VeloxMD-Windows-Exe
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
