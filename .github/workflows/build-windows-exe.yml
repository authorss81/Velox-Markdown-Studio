name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Type-check
        run: |
          npm run lint

      - name: Build web application
        run: |
          npm run build

      - name: Package Windows Executable (.exe)
        run: |
          npx --yes electron-builder --win nsis portable --publish never

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: 1-VeloxMD-Installer-Setup (Recommended)
          path: release/*Setup*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows Portable Standalone (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: 2-VeloxMD-Portable-Standalone
          path: |
            release/*.exe
            !release/*Setup*.exe
          if-no-files-found: warn
          retention-days: 30
