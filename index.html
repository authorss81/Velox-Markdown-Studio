<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Velox Markdown Studio</title>
    <meta name="description" content="Windows-native Markdown app to open, preview, edit, and save MD files with permanent memory, quick search, syntax highlighting, and downloadable installer." />
    <meta property="og:title" content="Velox Markdown Studio" />
    <meta property="og:description" content="Windows-native Markdown app to open, preview, edit, and save MD files with permanent memory, quick search, syntax highlighting, and downloadable installer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0078d4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VeloxMD" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <script>
      // Apply theme immediately to prevent flashing
      try {
        const raw = localStorage.getItem('velox_settings_v1');
        const theme = raw ? JSON.parse(raw).theme : 'dark';
        document.documentElement.classList.add(theme || 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="select-none overflow-hidden antialiased">
    <div id="root" class="h-screen w-screen overflow-hidden flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
